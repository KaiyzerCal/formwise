name: CI

# Nothing was enforcing lint, tests or the build before this — the test suite
# existed but only ever ran on someone's laptop, which makes it advisory
# rather than protective. Nothing here deploys; this only reports status.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

# A second push to a PR makes the earlier run redundant — cancel it rather
# than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the project is developed against. `cache: npm`
          # keys off package-lock.json, which is committed.
          node-version: "22"
          cache: npm

      # `npm ci` rather than `npm install`: it installs strictly from the
      # lockfile and fails if package.json and the lockfile have drifted,
      # which is exactly the check wanted in CI.
      - name: Install dependencies
        run: npm ci

      # Runs eslint with --quiet, so warnings (currently ~166 unused-import
      # findings) don't fail the build — only errors do. Deliberate: the
      # warnings are pre-existing and unrelated to whether a change is safe.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Last because it's the slowest, and a lint or test failure is a faster
      # signal about the same change.
      - name: Build
        run: npm run build
